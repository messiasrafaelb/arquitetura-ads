<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Produtos</title>
</head>
<body>
    <header>
        <h1>Produtos</h1>
    </header>
    <main>
        <nav>
            <p><a th:href="@{/}">Voltar para Home</a> | <a th:href="@{/stock}">Ir para Estoque</a></p>
        </nav>
        <section>
            <h2>Novo Produto</h2>
            <form th:action="@{/products}" th:object="${product}" method="post">
                <div>
                    <label for="name">Nome:</label>
                    <input type="text" name="name" id="name" th:field="*{name}" required>
                </div>
                <div>
                    <label for="price">Preço:</label>
                    <input type="number" step="0.01" name="price" id="price" th:field="*{price}" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </section>
        <section>
            <h2>Produtos Cadastrados:</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOME</th>
                        <th>VALOR</th>
                        <th>QUANTIDADE</th>
                        <th>STATUS</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.price}"></td>
                        <td th:text="${product.quantity}"></td>
                        <td th:text="${product.status != null ? product.status.description : ''}"></td>
                        <td>
                            <form th:if="${product.status != null and product.status.name() != 'DISCONTINUED'}"
                                  th:action="@{/products/{id}/discontinue(id=${product.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" style="background-color: #c9302c; color: white;">Descontinuar</button>
                            </form>
                            <span th:if="${product.status != null and product.status.name() == 'DISCONTINUED'}">Descontinuado</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>Projeto de compreensão do MVC</p>
    </footer>
</body>
</html>
